name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Test Proxy And Portable Setup
        run: bun test
      - name: Check Picker Shell Syntax
        run: sh -n picker-guard.sh
      - name: Check Optional Installer Shell Syntax
        run: sh -n tools/install-codex.sh
